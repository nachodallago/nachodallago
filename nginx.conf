server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Compresión: usa los .gz generados en el build y comprime on-the-fly lo demás
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # Seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # www -> apex
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    # URLs del sitio anterior -> nueva home (conserva el SEO)
    location ~ ^/(?:projects|blog|shop|gaming|cartas|referer|cookies|comming-soon|home)(?:/.*)?$ {
        return 301 /;
    }
    location ~ ^/contact/?$ {
        return 301 /#contacto;
    }

    # Tiempo real de FC 26 (Server-Sent Events): sin buffer y conexión larga
    location = /api/fc26/events {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API de resultados de FC 26 (Node + SQLite en 127.0.0.1:8787)
    location ^~ /api/fc26/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # La API pone su propio Cache-Control (no-store en datos, cache largo en fotos)
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Assets con hash: cache inmutable de 1 año
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|avif|svg|ico|woff2|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML siempre fresco
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
